; 宿舍电费监控器配置
; 复制本文件为 config.ini 并填入你自己的参数。
; 参数获取方法见 README.md「抓包获取配置」一节。

[api]
; 完美校园云缴费主机, 一般不用改
host = h5cloud.17wanxiao.com
port = 18443

; 缴费项目 ID, 每个学校/校区不同
pay_pro_id = XXXX

; 学校编码
school_code = XXX

; 业务类型, 电费为 2
business_type = 2

; 房间校验码, 形如 101-1--9-XXX, 编码了楼栋-楼层-房间
; 换宿舍房间时需要重新抓包
room_verify = 楼栋-楼层-房间编码

; 房间备注(仅用于通知显示)
room_label = 我的房间

[monitor]
; 剩余电量低于该值(度)时告警
threshold = 20
